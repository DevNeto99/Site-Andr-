<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>PDF Reader</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: white; }
        #viewerContainer { padding: 20px; }
        .page { margin-bottom: 40px; }
        .page canvas { display: block; margin: 0 auto; max-width: 100%; }
        .text-content { margin: 20px auto; padding: 18px; max-width: 960px; background: rgba(0,0,0,0.75); border-radius: 16px; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.5; color: #f8fafc; }
    </style>
    <script src="pdf.min.js"></script>
</head>
<body>
    <div id="viewerContainer">
        <div id="viewer" class="pdfViewer"></div>
        <div id="textContent" class="text-content"></div>
    </div>
    <script>
        const url = 'Apresentação - Media On Agencia de Marketing.pdf';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const loadingTask = pdfjsLib.getDocument(url);
        loadingTask.promise.then(async pdf => {
            const viewer = document.getElementById('viewer');
            const textContent = document.getElementById('textContent');
            let fullText = '';
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.5 });
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageDiv.style.position = 'relative';
                pageDiv.style.width = viewport.width + 'px';
                pageDiv.style.height = viewport.height + 'px';

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                pageDiv.appendChild(canvas);
                viewer.appendChild(pageDiv);
                const context = canvas.getContext('2d');
                await page.render({ canvasContext: context, viewport }).promise;

                const text = await page.getTextContent();
                const strings = text.items.map(item => item.str).join(' ');
                fullText += `\n\n--- Página ${pageNum} ---\n` + strings;
            }
            textContent.textContent = fullText;
        }).catch(error => {
            document.body.innerHTML = '<pre>Error loading PDF: ' + error + '</pre>';
            console.error(error);
        });
    </script>
</body>
</html>
